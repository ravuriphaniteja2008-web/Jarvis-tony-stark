<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>J.A.R.V.I.S. Mobile Edition 2.0</title>
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/arc-reactor.css">
  <link rel="stylesheet" href="css/terminal.css">
  <link rel="stylesheet" href="css/quick-actions.css">
</head>
<body>

  <!-- Main Mobile App Container -->
  <div class="app-container">
    
    <!-- Top HUD Header -->
    <header class="app-header">
      <div class="hud-title">J.A.R.V.I.S. <span class="version">v2.0</span></div>
      <div class="header-right-controls">
        <button id="terminal-toggle" class="terminal-btn" title="Toggle Dev Terminal">[DEV]</button>
        <div class="hud-status-indicator">
          <span class="dot"></span> ONLINE
        </div>
      </div>
    </header>

    <!-- Arc Reactor Visualizer -->
    <div class="reactor-container">
      <div id="arc-reactor" class="arc-reactor">
        <div class="ring-outer"></div>
        <div class="ring-inner"></div>
        <div class="reactor-core"></div>
      </div>
      <div id="status-label" class="status-label">STANDBY</div>
    </div>

    <!-- Chat Output Stream -->
    <div id="chat-output" class="chat-output">
      <div class="message jarvis-message">
        Greetings, Teja. J.A.R.V.I.S. 2.0 online and awaiting your command.
      </div>
    </div>

    <!-- Quick Action Chips Bar -->
    <div class="quick-actions-bar">
      <button class="action-chip" data-action="weather">⛅ Weather</button>
      <button class="action-chip" data-action="cricket">🏏 Live Cricket</button>
      <button class="action-chip" data-action="search">🔍 Web Search</button>
      <button class="action-chip" data-action="time">⏰ Local Time</button>
    </div>

    <!-- Interactive Controls / Input Area -->
    <div class="input-container">
      <input type="file" id="image-upload" accept="image/*" style="display: none;" />
      <button id="vision-btn" class="icon-btn" title="Upload Screenshot">📷</button>
      <button id="mic-btn" class="icon-btn" title="Voice Input">🎙️</button>
      <button id="wake-word-btn" class="icon-btn" title="Continuous Wake-Word">⚡</button>
      <input 
        type="text" 
        id="user-input" 
        placeholder="Enter command or speak..." 
        autocomplete="off" 
      />
      <button id="send-btn" class="icon-btn primary" title="Send">➤</button>
    </div>

  </div>

  <!-- Collapsible Developer Terminal Drawer -->
  <div id="terminal-drawer" class="terminal-drawer">
    <div class="terminal-header">
      <span>SYSTEM LOGS & TELEMETRY</span>
      <div class="terminal-actions">
        <button id="terminal-clear" class="terminal-btn">CLEAR</button>
        <button id="terminal-close" class="terminal-btn">✕</button>
      </div>
    </div>
    <div id="terminal-body" class="terminal-body">
      <div class="log-entry log-info">[SYSTEM] J.A.R.V.I.S. 2.0 Terminal initialized.</div>
    </div>
  </div>

  <!-- Entry Point JavaScript Module -->
  <script type="module" src="js/app.js"></script>
</body>
                                                                            </html>
