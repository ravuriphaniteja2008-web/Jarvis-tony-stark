<body>

  <!-- Main Mobile App Container -->
  <div class="app-container">
    
    <!-- Top HUD Header -->
    <header class="app-header">
      <div class="hud-title">J.A.R.V.I.S. <span class="version">v2.0</span></div>
      <div class="header-right-controls">
        <button id="terminal-toggle" class="terminal-btn" onclick="document.getElementById('terminal-drawer').classList.toggle('open')" title="Toggle Dev Terminal">[DEV]</button>
        <div class="hud-status-indicator">
          <span class="dot"></span> ONLINE
        </div>
      </div>
    </header>

    <!-- Arc Reactor Visualizer -->
    <div class="reactor-container">
      <div id="arc-reactor" class="arc-reactor">
        <div class="ring-outer"></div>
        <div class="ring-inner"></div>
        <div class="reactor-core"></div>
      </div>
      <div id="status-label" class="status-label">STANDBY</div>
    </div>

    <!-- Chat Output Stream -->
    <div id="chat-output" class="chat-output">
      <div class="message jarvis-message">
        Greetings, Teja. J.A.R.V.I.S. 2.0 online and awaiting your command.
      </div>
    </div>

    <!-- ========================================== -->
    <!-- PASTE THE CODE SNIPPET RIGHT HERE BELOW:   -->
    <!-- ========================================== -->

    <!-- Quick Action Chips Bar -->
    <div class="quick-actions-bar">
      <button class="action-chip" onclick="alert('Quick Action: Weather triggered!')">⛅ Weather</button>
      <button class="action-chip" onclick="alert('Quick Action: Cricket triggered!')">🏏 Live Cricket</button>
      <button class="action-chip" onclick="window.open('https://www.google.com', '_blank')">🔍 Web Search</button>
      <button class="action-chip" onclick="alert('Local Time: ' + new Date().toLocaleTimeString())">⏰ Local Time</button>
    </div>

    <!-- Interactive Controls / Input Area -->
    <div class="input-container">
      <input type="file" id="image-upload" accept="image/*" style="display: none;" />
      <button id="vision-btn" class="icon-btn" onclick="document.getElementById('image-upload').click();" title="Upload Screenshot">📷</button>
      <button id="mic-btn" class="icon-btn" onclick="alert('Microphone button tapped!');" title="Voice Input">🎙️</button>
      <button id="wake-word-btn" class="icon-btn" onclick="alert('Wake-word mode toggled!');" title="Continuous Wake-Word">⚡</button>
      <input 
        type="text" 
        id="user-input" 
        placeholder="Enter command or speak..." 
        autocomplete="off" 
      />
      <button id="send-btn" class="icon-btn primary" onclick="const txt = document.getElementById('user-input').value; if(txt) { alert('Sending: ' + txt); document.getElementById('user-input'].value = ''; }" title="Send">➤</button>
    </div>

  </div> <!-- End of app-container -->

  <!-- Collapsible Developer Terminal Drawer -->
  ...
</body>
